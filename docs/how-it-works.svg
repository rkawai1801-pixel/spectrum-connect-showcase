<text x="40" y="54" font-size="26" font-weight="700" fill="#0b1f3a">How one question becomes a report</text>
<text x="40" y="84" font-size="15" fill="#475569">The AI reads and reports facts. Code makes every decision. A person signs before anything goes out.</text>
